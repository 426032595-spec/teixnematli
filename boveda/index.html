<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0612">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Bóveda de apuntes</title>
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#0a0612;color:#f6eeff;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px;box-sizing:border-box}
p{margin:0 0 16px;color:#a995cc}
a{display:inline-block;margin:6px;padding:12px 20px;border-radius:12px;border:1px solid rgba(200,150,255,.3);color:#ff7ac6;text-decoration:none;font-weight:600}
a:hover{background:rgba(190,130,255,.13)}
</style>
<script>
(function(){
  var DESKTOP='escritorio.html', MOBILE='movil.html';
  var q=location.search+location.hash, target=null;

  // 1) Forzar versión manualmente: index.html?v=movil  o  ?v=escritorio
  var m=/[?&#]v=(movil|escritorio)\b/i.exec(q);
  if(m) target=m[1].toLowerCase()==='movil'?MOBILE:DESKTOP;

  // 2) Detección automática
  if(!target){
    var ua=navigator.userAgent||'';
    var uaMobile=/Android|iPhone|iPod|Windows Phone|Mobile|Opera Mini|IEMobile|BlackBerry/i.test(ua);
    // iPadOS se identifica como Mac pero tiene pantalla táctil
    var ipad=/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1;
    var uaData=navigator.userAgentData&&navigator.userAgentData.mobile===true;
    var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches&&!matchMedia('(any-pointer:fine)').matches;
    var shortSide=Math.min(screen.width||9999,screen.height||9999);
    var narrow=Math.min(window.innerWidth||9999,shortSide)<=820;
    var isMobile=uaMobile||uaData||((ipad||coarse)&&narrow);
    target=isMobile?MOBILE:DESKTOP;
  }

  // Conserva ?v= al saltar, y evita volver atrás al redireccionador
  location.replace(target);
})();
</script>
</head>
<body>
<noscript>
  <div>
    <p>Elige la versión de la Bóveda de apuntes:</p>
    <a href="escritorio.html">Computadora</a><a href="movil.html">Celular</a>
  </div>
</noscript>
<div>
  <p>Abriendo la Bóveda de apuntes…</p>
  <a href="escritorio.html">Computadora</a><a href="movil.html">Celular</a>
</div>
</body>
</html>
