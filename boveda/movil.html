<!doctype html><html lang="es" data-th="galaxia"><head><meta charset="utf-8">

<title>Teixnematli</title>
<style>
@font-face{font-family:'Unbounded';font-weight:400;font-display:swap;src:url(fonts/unbounded-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Unbounded';font-weight:600;font-display:swap;src:url(fonts/unbounded-latin-600-normal.woff2) format('woff2')}

@font-face{font-family:'Hanken Grotesk';font-weight:500;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:600;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
</style>
<style>
:root{--f-display:'Unbounded','Segoe UI',system-ui,sans-serif;--f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);color-scheme:dark}
html[data-th=galaxia]{--bg:#0a0612;--surface:#170a2b;--surface2:#241242;--line:rgba(200,150,255,.2);--fg:#f6eeff;--muted:#a995cc;--accent:#ff7ac6;--accent-ink:#2a0618;--danger:#ff8a80;--g1:rgba(255,79,163,.2);--g2:rgba(45,226,197,.1)}
html[data-th=biblioteca]{--bg:#0e0805;--surface:#1f130a;--surface2:#2d1d0f;--line:rgba(232,190,110,.24);--fg:#f8ecd6;--muted:#b39a78;--accent:#e8b04a;--accent-ink:#241206;--danger:#ff9a85;--g1:rgba(232,176,74,.15);--g2:rgba(120,60,20,.2)}
html[data-th=galaxia]{--deco:radial-gradient(1.3px 1.3px at 12% 18%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 72% 12%,rgba(255,200,232,.5),transparent),radial-gradient(1.2px 1.2px at 38% 64%,rgba(185,255,240,.4),transparent),radial-gradient(1px 1px at 88% 52%,rgba(255,255,255,.45),transparent),radial-gradient(1.4px 1.4px at 22% 86%,rgba(255,255,255,.4),transparent)}
html[data-th=biblioteca]{--deco:repeating-linear-gradient(180deg,transparent 0 142px,rgba(232,190,110,.07) 142px 144px,rgba(43,26,14,.55) 144px 152px,transparent 152px 160px),radial-gradient(120% 40% at 50% -6%,rgba(255,196,110,.2),transparent 70%)}
html[data-th=fuego]{--deco:radial-gradient(110% 38% at 50% 108%,rgba(255,90,20,.28),transparent 70%)}
html[data-th=fuego]{--bg:#000;--surface:#0e0805;--surface2:#1b0f08;--line:rgba(255,140,60,.26);--fg:#fff0e2;--muted:#c4946a;--accent:#ff8a2a;--accent-ink:#1a0800;--danger:#ff7a6a;--g1:rgba(255,90,20,.18);--g2:rgba(255,40,40,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:fixed;inset:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
input,.rich{-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0;font-family:var(--f-display)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:absolute;left:0;right:0;top:0;height:var(--vh,100%);overflow:hidden;background:var(--deco,none),radial-gradient(120% 55% at 10% -8%,var(--g1),transparent 60%),radial-gradient(100% 45% at 100% 100%,var(--g2),transparent 60%),var(--bg)}
#root{position:absolute;inset:0}
.page{position:absolute;left:0;right:0;top:0;bottom:calc(60px + var(--sab));overflow-y:auto;overscroll-behavior:contain;display:none;padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) 110px calc(var(--sal) + 16px)}
.page.on{display:block}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top{margin-bottom:14px}.top h1{font-size:24px;font-weight:600;line-height:1.2;margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;font-size:13px;color:var(--muted)}
.lbl{margin:20px 2px 8px;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#tabs{position:absolute;left:0;right:0;bottom:0;height:calc(60px + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600}
#tabs button.on{color:var(--accent)}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.sc{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;min-height:84px;cursor:pointer}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 140% at 0% 50%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%);pointer-events:none}
.sc::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.sc-main{flex:1;min-width:0;position:relative}
.sc-name{font:600 16px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-meta{font-size:13px;color:var(--muted);margin-top:4px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;line-height:1;position:relative;flex:none}
.ib:active,.chipb:active,.pill:active{background:var(--surface2)}
.fab{position:absolute;right:calc(var(--sar) + 18px);bottom:calc(76px + var(--sab));width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 8px 26px rgba(0,0,0,.45);z-index:15}
.fab:active{transform:scale(.94)}
.fab.low{bottom:calc(20px + var(--sab))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--deco,none),radial-gradient(120% 55% at 10% -8%,var(--g1),transparent 60%),var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:30}
.screen.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#scNote{z-index:40}
.bar{display:flex;align-items:center;gap:4px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 6px);flex:none}
.bar .ttl{flex:1;min-width:0;font:600 17px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.grow{flex:1}
.chipb{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-weight:600;font-size:14px;background:var(--surface)}
.seg2{display:flex;margin:4px calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px);padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;flex:none}
.seg2 button{flex:1;height:38px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
.sbox{padding:0 calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px);flex:none}
.sbox input,.fld input{width:100%;height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
input::placeholder{color:var(--muted)}
.sbody{flex:1;min-height:0;position:relative;overflow-y:auto;overscroll-behavior:contain;padding:0 calc(var(--sar) + 14px) 110px calc(var(--sal) + 14px)}
.sbody.mapon{overflow:hidden;padding:0}
.note{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px 12px calc(14px + var(--d,0)*18px);background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:62px}
.note:active{background:var(--surface2)}
.note .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.note .nt{flex:1;min-width:0;display:flex;flex-direction:column}
.note b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .nm{font-size:12px;color:var(--muted);flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#scSubj .bar,#scSubj .seg2,#scSubj .sbox{position:relative;z-index:2}
.sbody{z-index:1}
.sbody.mapon{pointer-events:none}
.sbody.mapon .pill{pointer-events:auto}
.bt{width:54px;height:54px;flex:none;margin:-8px -4px -8px -8px;pointer-events:none}
.sbt{width:60px;height:60px;flex:none;position:relative;margin-left:-8px;pointer-events:none}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));height:42px;padding:0 20px;border-radius:21px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.nbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px calc(var(--sar) + 18px) 40px calc(var(--sal) + 18px)}
.ntitle{width:100%;border:0;background:none;font:600 24px/1.25 var(--f-display);padding:6px 0;outline:none}
.crumb{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px;font-size:13px;color:var(--muted);align-items:center}
.rich,.read{font-size:17px;line-height:1.7;overflow-wrap:anywhere;min-height:140px}
.rich{outline:none;padding:4px 0}
.rich:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rich p,.rich div,.read p{margin:0 0 .7em}
.rich h4,.read h4{font-size:17px;font-weight:600;margin:1.1em 0 .4em;color:var(--accent)}
.rich ul,.rich ol,.read ul,.read ol{margin:0 0 .8em;padding-left:1.4em}
.rich code,.read code{font:14px ui-monospace,Menlo,monospace;background:var(--surface2);padding:1px 6px;border-radius:5px}
.wl{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer}
.wl.un{color:var(--muted);border-bottom-style:dashed}
.etb{display:flex;gap:6px;overflow-x:auto;padding:8px calc(var(--sar) + 10px) calc(8px + var(--sab)) calc(var(--sal) + 10px);background:var(--surface);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
.etb::-webkit-scrollbar{display:none}
.etb button{flex:none;height:42px;min-width:44px;padding:0 14px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14px;white-space:nowrap}
.etb .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.sec{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.sec h3{display:flex;justify-content:space-between;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;max-width:100%}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.chip.un{color:var(--muted);border-style:dashed}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.strip button{flex:none;width:110px;height:110px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.btn{height:46px;padding:0 20px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dan{background:var(--danger);color:#1a0505;border-color:transparent}
.btn.ghost{color:var(--danger);background:transparent}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;background:var(--c);border:2px solid transparent;position:relative;overflow:hidden}
.sw.on{outline:2px solid var(--fg);outline-offset:2px}
.sw input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0}
.sw.custom{background:conic-gradient(#ff5d6c,#ffd866,#3fe0c1,#6f7dff,#f06be0,#ff5d6c)}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 6px;text-align:left;font-size:16px;font-weight:500;border-radius:12px}
.mi:active{background:var(--surface2)}.mi.dan{color:var(--danger)}.mi small{margin-left:auto;color:var(--muted);font-size:13px}
.opt{display:flex;gap:8px;margin-bottom:6px}
.opt button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.opt button.on{border-color:var(--accent);color:var(--accent)}
#bg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#bg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px calc(var(--sar) + 18px) calc(22px + var(--sab)) calc(var(--sal) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:61}
#sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
#sheet h2{font-size:17px;font-weight:600;margin-bottom:14px}
.fld{margin-bottom:14px}.fld>span{display:block;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sab));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:90;pointer-events:none}
.toast{pointer-events:auto;max-width:480px;padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 8px 26px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast button{margin-left:12px;font-weight:700;text-decoration:underline;color:inherit}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#viewer,#pres{position:fixed;inset:0;z-index:100;background:var(--bg)}
#pcv{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.pbar{z-index:3}
.pc{margin-top:18px;padding:14px 16px 16px;border-radius:20px;background:color-mix(in srgb,var(--bg) 68%,transparent);border:1px solid var(--line)}
.pc>.read:first-child,.pc>.pim:first-child{margin-top:0}
#viewer{background:#000;display:flex;flex-direction:column}
#viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
#viewer .bar{background:rgba(0,0,0,.6)}
.pbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) 6px calc(var(--sal) + 8px);z-index:3}
.pbar span{flex:1;text-align:center;font:500 13px ui-monospace,Menlo,monospace;color:var(--muted)}
.pslides{position:relative;z-index:1;display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none}
.pslides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:calc(var(--sat) + 70px) calc(var(--sar) + 22px) calc(var(--sab) + 40px) calc(var(--sal) + 22px);font-size:calc(18px*var(--pf,1))}
.slide h2{font-size:calc(24px*var(--pf,1));line-height:1.2;margin-bottom:6px;text-align:center;text-shadow:0 2px 14px #000,0 0 26px var(--c)}
.slide .eb{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 58%,#fff);text-align:center;text-shadow:0 1px 8px #000}
.slide .read{font-size:inherit;margin-top:0}
.slide .pim img{width:100%;max-height:30vh;object-fit:contain;border-radius:14px;margin-bottom:12px;background:rgba(0,0,0,.25)}
.slide .chips{margin-top:16px}
@media (prefers-reduced-motion:reduce){.screen,#sheet,.toast{transition:none;animation:none}}
</style>
</head><body>
<div id="app">
<main id="root">
 <section class="page on" id="pgHome"><div class="top"><div class="eyebrow">Teixnematli</div><h1>Tus materias</h1></div><div class="list" id="subjList"></div><div id="recent"></div></section>
 <section class="page" id="pgSearch"><div class="top"><div class="eyebrow">En todas las materias</div><h1>Buscar</h1></div><div class="fld"><input id="gq" type="search" placeholder="Título o texto de la nota…" aria-label="Buscar"></div><div class="list" id="gres"></div></section>

 <nav id="tabs" aria-label="Secciones">
  <button class="on" data-t="Home"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Materias</button>

 </nav>
</main>
<section class="screen" id="scSubj">
 <canvas id="cv" hidden role="img" aria-label="Mapa de notas"></canvas>
 <header class="bar"><button class="ib" id="sBack" aria-label="Volver">‹</button><div class="ttl" id="sTitle"></div><button class="ib" id="sPres" aria-label="Presentar" title="Presentar">▶</button><button class="ib" id="sMore" aria-label="Opciones">⋯</button></header>
 <div class="seg2" id="seg"><button data-v="list" class="on">Lista</button><button data-v="map">Mapa</button></div>
 <div class="sbox" id="sqBox"><input id="sq" type="search" placeholder="Buscar en esta materia" aria-label="Buscar en esta materia"></div>
 <div class="sbody" id="sBody"><div class="list" id="nList"></div><button class="pill" id="mFit" hidden>Centrar</button></div>
 <button class="fab low" id="sFab" aria-label="Nueva nota">+</button>
</section>

 <header class="bar"><button class="ib" id="nBack" aria-label="Volver">‹</button><div class="grow"></div><button class="chipb" id="nMode">Editar</button><button class="ib" id="nMore" aria-label="Opciones">⋯</button></header>
 <div class="nbody" id="nBody"><input id="ntitle" class="ntitle" maxlength="80" placeholder="Título" aria-label="Título de la nota"><div class="crumb" id="nCrumb"></div><div id="nEdit"></div><div id="nSecs"></div></div>
 <div class="etb" id="etb" hidden><button data-f="bold"><b>N</b></button><button data-f="italic"><i>C</i></button><button data-f="underline"><u>S</u></button><span class="sep"></span><button data-f="h">Título</button><button data-f="ul">• Lista</button><button data-f="ol">1. Lista</button><span class="sep"></span><button data-f="link">Enlazar</button><button data-f="img">Imagen</button><button data-f="fix">Corregir</button></div>
</section>
</div>

/* ---------- Markdown <-> editor visual ---------- */
function md(body){
  function inline(s){
    s=esc(s);
    s=s.replace(/\[\[([^\[\]|]+?)(?:\|([^\[\]]*))?\]\]/g,function(m,t,al){
      var raw=t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      return '<span class="wl'+(subj&&findByTitle(raw)?'':' un')+'" data-t="'+t.trim()+'">'+(al&&al.trim()?al.trim():t.trim())+'</span>';
    });
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<u>$1</u>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
    return s;
  }
  var out='',list=null;
  String(body||'').split('\n').forEach(function(line){
    var li=/^\s*[-*]\s+(.*)$/.exec(line),ol=/^\s*\d+[.)]\s+(.*)$/.exec(line),h=/^#{1,3}\s+(.*)$/.exec(line),want=li?'ul':(ol?'ol':null);
    if(want){if(list!==want){if(list)out+='</'+list+'>';out+='<'+want+'>';list=want;}out+='<li>'+inline((li||ol)[1])+'</li>';return;}
    if(list){out+='</'+list+'>';list=null;}
    if(h)out+='<h4>'+inline(h[1])+'</h4>';else if(line.trim())out+='<p>'+inline(line)+'</p>';
  });
  if(list)out+='</'+list+'>';
  return out;
}
var BLK=/^(P|DIV|H[1-6]|UL|OL|LI|BLOCKQUOTE|PRE)$/;
function wrapMark(mark,inner){var m=/^(\s*)([\s\S]*?)(\s*)$/.exec(inner);return m[1]+mark+m[2]+mark+m[3];}
function inl(n){
  if(n.nodeType===3)return n.nodeValue.replace(/ /g,' ');
  if(n.nodeType!==1)return '';
  var tag=n.nodeName;
  if(tag==='BR')return '\n';
  if(tag==='SPAN'&&n.classList.contains('wl')&&n.getAttribute('data-t')){var t=n.getAttribute('data-t'),lb=n.textContent;return '[['+t+(lb&&lb!==t?'|'+lb:'')+']]';}
  var inner='';for(var c=n.firstChild;c;c=c.nextSibling)inner+=inl(c);
  if(!inner.trim())return inner;
  var st=n.style||{},fw=st.fontWeight,bold=tag==='B'||tag==='STRONG'||fw==='bold'||(+fw>=600),ital=tag==='I'||tag==='EM'||st.fontStyle==='italic',und=tag==='U'||(st.textDecoration||'').indexOf('underline')>=0;
  if(tag==='CODE')return wrapMark('`',inner);
  if(ital)inner=wrapMark('*',inner);
  if(bold)inner=wrapMark('**',inner);
  if(und)inner=wrapMark('__',inner);
  return inner;
}
function richToMd(root){
  var lines=[],buf='';
  function flush(){buf.split('\n').forEach(function(l){if(l.trim())lines.push(l.trim());});buf='';}
  function walk(el){
    for(var c=el.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3||!BLK.test(c.nodeName)){buf+=inl(c);continue;}
      flush();var tag=c.nodeName;
      if(/^H[1-6]$/.test(tag)){var t=inl(c).replace(/\n/g,' ').trim();if(t)lines.push('# '+t);}
      else if(tag==='UL'||tag==='OL'){var i=0;for(var li=c.firstChild;li;li=li.nextSibling){if(li.nodeName!=='LI')continue;var tx=inl(li).replace(/\n/g,' ').trim();if(tx){i++;lines.push((tag==='UL'?'- ':i+'. ')+tx);}}}
      else{var hasB=false;for(var k=c.firstChild;k;k=k.nextSibling)if(k.nodeType===1&&BLK.test(k.nodeName)){hasB=true;break;}
        if(hasB){walk(c);flush();}else{buf=inl(c);flush();}}
    }
  }
  walk(root);flush();return lines.join('\n');
}
function richFromMd(body){if(!body||!body.trim())return '';return md(body).replace(/<span class="wl/g,'<span contenteditable="false" class="wl');}

function fixText(txt){
  var cnt=0,L='A-Za-zÁÉÍÓÚÜÑáéíóúüñ',re=new RegExp('(^|[^'+L+'])('+Object.keys(FIX).join('|')+')(?!['+L+'])','gi'),re2=new RegExp('(['+L+']+)([csg])ion(?!['+L+'])','g');
  var out=txt.split(/(\[\[[^\]]*\]\])/).map(function(seg,i){
    if(i%2)return seg;
    seg=seg.replace(re,function(m,pre,w){var f=FIX[w.toLowerCase()];cnt++;if(w.length>1&&w===w.toUpperCase())f=f.toUpperCase();else if(w.charAt(0)!==w.charAt(0).toLowerCase())f=f.charAt(0).toUpperCase()+f.slice(1);return pre+f;});
    seg=seg.replace(re2,function(m,a,b){cnt++;return a+b+'ión';});
    return seg.replace(/(\S) {2,}/g,'$1 ');
  }).join('');

}

function drawPlanet(x,y,r,col,kind,ring,seed,im){

  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  if(im&&im.complete&&im.naturalWidth){var sc=Math.max(2*r/im.naturalWidth,2*r/im.naturalHeight);ctx.drawImage(im,x-im.naturalWidth*sc/2,y-im.naturalHeight*sc/2,im.naturalWidth*sc,im.naturalHeight*sc);}

/* ---------- navegación por capas (botón Atrás de Android) ---------- */
var layers=[],pend=0,sheetOpen=false,nav={tab:'Home',view:'list'},curNote=null,mode='read',lastSnap=null;
/* Cada capa abierta ocupa una entrada del historial. Si hay un retroceso en curso,
   el pushState se aplaza hasta que termine: así nunca se desfasa el historial. */
var pq=[];
function doPush(l){l.wait=false;try{history.pushState({l:1},'');}catch(e){l.nh=1;}}
function flushPq(){var q=pq.splice(0);q.forEach(function(l){if(layers.indexOf(l)>=0)doPush(l);});}
function push(name,close){var l={name:name,close:close,wait:false};layers.push(l);if(pend>0){l.wait=true;pq.push(l);}else doPush(l);}
function pop(name){
  var l=layers[layers.length-1];if(!l||(name&&l.name!==name))return;
  layers.pop();l.close();
  if(l.wait){pq=pq.filter(function(x){return x!==l;});return;}
  if(l.nh)return;
  pend++;try{history.back();}catch(e){pend--;return;}
  setTimeout(function(){if(pend>0){pend=0;flushPq();}},600);
}
window.addEventListener('popstate',function(){
  if(pend>0){pend--;if(pend===0)flushPq();return;}
  var l=layers.pop();if(l){l.close();}
});

  box.appendChild(el);while(box.children.length>2)box.firstChild.remove();

}

    n.imgs.forEach(function(id){if(map[id]||!imgData.has(id))return;var d=imgData.get(id),p='imagenes/'+id+'.'+dataExt(d);map[id]=p;files.push({path:p,bytes:toBytes(d)});nimg++;});
    n.imgs=n.imgs.filter(function(id){return !!map[id];});});});
  var meta={app:'boveda-apuntes-carpeta',v:2,at:Date.now(),theme:S.theme,subjects:clean,imgs:map};
  files.unshift({path:'LEEME.txt',bytes:enc.encode('Bóveda de apuntes — copia portátil\r\n\r\nEn otro celular: Más › Importar copia y elige el .zip.\r\nEn computadora: descomprime y usa Respaldo › Importar carpeta.\r\n')});
  files.unshift({path:'boveda.json',bytes:enc.encode(JSON.stringify(meta))});
  return {files:files,nimg:nimg};
}
function exportSubjects(list){
  if(!list||!list.length)return;
  var folder=list.length===1?'Boveda - '+cleanName(list[0].name):'Boveda - todas las materias',pk;
  try{pk=buildPackage(list);}catch(x){toast('No se pudo preparar la exportación.');return;}
  var blob=makeZip(pk.files.map(function(f){return {path:folder+'/'+f.path,bytes:f.bytes};})),name=folder+'.zip';
  var msg='Exportadas '+plural(list.length,'materia','materias')+' con '+plural(pk.nimg,'imagen','imágenes')+'.';
  try{
    var f=new File([blob],name,{type:'application/zip'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:folder}).then(function(){toast(msg);},function(er){if(er&&er.name==='AbortError')return;dl();});return;
    }
  }catch(x){}
  dl();
  function dl(){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);toast(msg+' Guardado como «'+name+'».');}
}

/* ---------- importar (.zip de móvil o escritorio, o .json) ---------- */
function mergeImport(o,imgMap){
  if(!o||!Array.isArray(o.subjects)||!o.subjects.length){toast('Ese archivo no es una copia de la Bóveda.');return;}
  snap();
  var tmp=norm({subjects:o.subjects,current:o.subjects[0].id}),names=S.subjects.map(function(s){return s.name.toLowerCase();}),first=null,lost=0;
  Object.keys(imgMap||{}).forEach(function(id){imgData.set(id,imgMap[id]);idbPut(id,imgMap[id]);});
  tmp.subjects.forEach(function(s){
    s.id=uid();s.view=null;var nm=s.name,c=2;while(names.indexOf(nm.toLowerCase())>=0)nm=s.name+' ('+(c++)+')';s.name=nm;names.push(nm.toLowerCase());
    s.notes.forEach(function(n){var b=n.imgs.length;n.imgs=n.imgs.filter(function(id){return imgData.has(id);});lost+=b-n.imgs.length;});
    S.subjects.push(s);if(!first)first=s;
  });
  save();renderHome();if(nav.tab==='More')renderMore();
  toast('Importadas '+plural(tmp.subjects.length,'materia','materias')+(lost?' ('+lost+' imágenes no venían en la copia)':'')+'.','Deshacer',undo);
}
$('#fImp').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var isZip=/\.zip$/i.test(f.name)||/zip/.test(f.type);
  if(!isZip){
    var fr=new FileReader();fr.onload=function(){var o;try{o=JSON.parse(fr.result);}catch(x){}mergeImport(o,{});};fr.readAsText(f);return;
  }
  f.arrayBuffer().then(readZip).then(function(files){
    var js=files['boveda.json'];if(!js){toast('Ese .zip no tiene boveda.json.');return;}
    var o;try{o=JSON.parse(new TextDecoder().decode(js));}catch(x){}
    if(!o||o.app!=='boveda-apuntes-carpeta'){toast('Ese .zip no es una exportación de la Bóveda.');return;}
    var ids=Object.keys(o.imgs||{}),map={};
    function b64(u){var s='',ch=0x8000;for(var i=0;i<u.length;i+=ch)s+=String.fromCharCode.apply(null,u.subarray(i,i+ch));return btoa(s);}
    ids.forEach(function(id){var p=o.imgs[id],u=files[p];if(!u)return;var ext=(p.split('.').pop()||'jpg').toLowerCase(),mime=ext==='jpg'?'jpeg':(ext==='svg'?'svg+xml':ext);map[id]='data:image/'+mime+';base64,'+b64(u);});
    mergeImport(o,map);
  }).catch(function(er){toast(er&&er.message==='nods'?'Este navegador no puede abrir ese .zip comprimido. Importa el que exportaste desde la Bóveda.':'No pude leer ese archivo.');});
});

/* ---------- arranque ---------- */
function fitVh(){var vv=window.visualViewport,h=vv?vv.height:window.innerHeight;document.getElementById('app').style.setProperty('--vh',h+'px');if(mapOn){W=0;mapSize();needDraw=true;}}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitVh);}
window.addEventListener('resize',fitVh);window.addEventListener('orientationchange',function(){setTimeout(fitVh,200);});

function boot(){
  S=loadLocal();
  if(S)S=norm(S);else{S=norm({v:1,updatedAt:0,current:'x',subjects:seed()});S.current=S.subjects[0].id;}
  subj=S.subjects.filter(function(s){return s.id===S.current;})[0]||S.subjects[0];
  applyTheme(S.theme,true);fitVh();rebuild();renderHome();showTab('Home');
  idbOpen().then(function(db){idb=db;return idbAll();}).then(function(rows){
    rows.forEach(function(r){imgData.set(r[0],r[1]);});
    /* migrar imágenes que estuvieran embebidas en la copia local */
    if(curNote)renderSecs();
  });
  if(!localOk)toast('Este navegador no permite guardar. Exporta tus notas antes de cerrar.');
  if('serviceWorker' in navigator){}
}
boot();
})();
