<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'">
<style>html,body{margin:0}</style><title>Bóveda de apuntes</title>
<style>
@font-face{font-family:'Unbounded';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/unbounded-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Unbounded';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/unbounded-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
</style>
<style>
/* Concepto: cada materia es una galaxia ilustrada. Las notas son planetas (los temas más conectados son estrellas), los [[enlaces]] son constelaciones y el panel es el cuaderno de bitácora. Nebulosa magenta y verde azulado sobre violeta casi negro. Diseño único y oscuro a propósito. */
:root{
  --bg:#0a0612; --surface:rgba(22,10,40,.88); --surface2:rgba(190,130,255,.13); --line:rgba(200,150,255,.22);
  --fg:#f6eeff; --muted:#a995cc; --accent:#ff7ac6; --accent-ink:#2a0618; --danger:#ff8a80; --card:rgba(20,9,36,.97); --tabs:rgba(12,6,24,.92);
  --f-display:'Unbounded','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
h1,h2,h3,h4{margin:0;font-family:var(--f-display)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.brand svg{color:var(--accent)}
.add{display:flex;gap:8px;flex:1 1 260px;min-width:0;max-width:460px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

input[type=text],input:not([type]),input[type=search]{height:38px;min-width:0;flex:1;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);color:var(--fg)}
input::placeholder,textarea::placeholder{color:var(--muted)}
button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-weight:600;font-size:13px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.small{height:30px;padding:0 10px;font-size:12px}
button.danger{background:var(--danger);color:var(--bg);border-color:transparent}

.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--tabs)}
.tabrow{display:flex;gap:8px;overflow-x:auto;flex:1 1 320px;min-width:0;padding-block:2px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;height:34px;flex:none}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--sw);display:inline-block;box-shadow:0 0 10px var(--sw)}
.tab small{color:var(--muted);font:500 11px var(--f-mono)}
.tab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.counts{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.tabs .small{flex:none}
.find{display:flex;flex:0 1 220px;min-width:140px}
.find input{height:34px}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:24px}
.empty div{max-width:380px;text-align:center;color:var(--muted);pointer-events:auto}
.empty button{margin-top:14px;height:40px}
.empty h2{font-size:15px;font-weight:400;color:var(--fg);margin-bottom:8px}

.top{position:absolute;top:12px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.top>*{pointer-events:auto}
.banner{display:flex;align-items:center;gap:12px;max-width:560px;padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.banner button{height:30px;background:transparent;border-color:currentColor;color:inherit}
.toast{max-width:560px;padding:10px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:in .2s ease-out;margin-top:6px}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

#panel{position:absolute;z-index:10;right:0;top:0;bottom:0;width:360px;max-width:100%;overflow-y:auto;background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-left:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) 28px 16px}
@media (max-width:760px){
  #panel{top:auto;left:0;right:0;width:auto;max-height:64%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18)}
  .tabrow{flex-basis:100%}
  .find{flex:1 1 140px}
  .counts{display:none}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb i{width:9px;height:9px;border-radius:50%;background:var(--sw);flex:none}
.x{height:30px;width:30px;padding:0;font-size:18px;line-height:1}
#pTitle{font-family:var(--f-display);font-size:14px;font-weight:400;height:44px;width:100%}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{height:30px;font-size:12px;flex:1}
.seg button.on{border-color:var(--accent);color:var(--accent)}
#pBody{width:100%;min-height:200px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);padding:10px;font:13.5px/1.55 var(--f-mono);resize:vertical;color:var(--fg)}
.read{margin-top:10px;min-height:120px;padding:2px 0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.read p{margin:0 0 .7em}
.read h4{font-size:13px;font-weight:600;margin:1.1em 0 .4em;letter-spacing:.02em}
.read ul,.read ol{margin:0 0 .8em;padding-left:1.4em}
.read code{font:12.5px var(--f-mono);background:var(--surface2);padding:1px 5px;border-radius:4px}
.wl{all:unset;cursor:pointer;color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.wl:hover{border-bottom-color:var(--accent)}
.wl.un{color:var(--muted);border-bottom-style:dashed}
.wl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sec h3{display:flex;justify-content:space-between;align-items:baseline;font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec h3.sub{margin-top:8px}
.sec h3 small{font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.hint{margin:0;font-size:12px;color:var(--muted)}
.link{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px}
.link .go{flex:1;min-width:0;height:32px;text-align:left;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.link .un{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);padding:0;height:auto}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th+.rm,.gal .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;padding:0;border-radius:50%;background:rgba(10,5,20,.82);font-size:14px;line-height:1}
.cell{position:relative}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;padding:0;border-radius:50%;background:var(--sw);border:2px solid transparent}
.sw.on{outline:2px solid var(--fg);outline-offset:2px}
.danger-box{margin-top:14px;padding:12px;border:1px solid var(--danger);border-radius:10px}
.danger-box p{margin:0 0 10px}
.ghost-danger{margin-top:22px;width:100%;color:var(--danger);background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}

#dlg{position:absolute;inset:0;z-index:50;display:flex;padding:16px;background:rgba(8,4,16,.64);overflow:auto}
#dlg .card{margin:auto;width:100%;max-width:520px;background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:20px;max-height:100%;overflow:auto;min-width:0}
#dlg .card.wide{max-width:900px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.dh h2{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fld>span{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .fld input{width:100%}
.card img.big{display:block;max-width:100%;max-height:78vh;margin:auto;border-radius:8px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* ===== v4: selección múltiple, deshacer, colores ===== */
.top>#toasts{pointer-events:none}.toast button{pointer-events:auto;height:26px;margin-left:10px;padding:0 10px;font-size:12px;background:var(--bg);color:var(--fg);border-color:transparent}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#ff5d6c,#ffd866,#3fe0c1,#6f7dff,#f06be0,#ff5d6c);cursor:pointer;display:block}
.sw.custom input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer;padding:0;border:0}
.sw.custom.on{background:var(--sw)}
#mbar{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 10px 34px rgba(0,0,0,.45)}
#mbar[hidden]{display:none}
#mbar span{font:600 12px var(--f-body);color:var(--muted);padding:0 6px}
#mbar button{height:32px;padding:0 12px;font-size:13px}
#mbar button:disabled{opacity:.4;cursor:default}
#btnSel.on{border-color:var(--accent);color:var(--accent)}
#btnUndo:disabled,#btnRedo:disabled{opacity:.35;cursor:default}

.ac{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.ac button{display:flex;width:100%;height:32px;border:0;border-radius:0;justify-content:flex-start;align-items:center;background:transparent;font-weight:500}
.ac button.on{background:var(--surface2);color:var(--accent)}
.qs-list{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.qs-item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;height:38px;text-align:left;background:transparent;border-color:transparent;font-weight:500}
.qs-item span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.qs-item small{color:var(--muted);font:500 11px var(--f-mono);flex:none}
.qs-item.on{background:var(--surface2);border-color:var(--accent)}
.keys{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 18px;margin:10px 0 0;align-items:center}
.keys dt{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.keys dd{margin:0;color:var(--muted);font-size:13px}
kbd{font:500 12px var(--f-mono);padding:3px 8px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface2);color:var(--fg)}
.kh{margin:18px 0 0;font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.keyhint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:12px;z-index:5;font-size:11px;color:var(--muted);pointer-events:none}
@media (max-width:760px){.keyhint{display:none}}

/* ===== estilos visuales ===== */
body.th-biblioteca{--bg:#0e0805;--surface:rgba(32,19,11,.9);--surface2:rgba(232,190,110,.12);--line:rgba(232,190,110,.24);--fg:#f8ecd6;--muted:#b39a78;--accent:#e8b04a;--accent-ink:#241206;--card:rgba(26,15,8,.97);--tabs:rgba(18,10,5,.92);--danger:#ff9a85}
body.th-fuego{--bg:#000;--surface:rgba(0,0,0,.9);--surface2:rgba(255,140,50,.12);--line:rgba(255,140,60,.24);--fg:#fff0e2;--muted:#c4946a;--accent:#ff8a2a;--accent-ink:#1a0800;--card:rgba(0,0,0,.97);--tabs:#000;--danger:#ff7a6a}
.themes{display:flex;gap:4px}
.themes button{height:30px;padding:0 10px;font-size:12px}
.themes button.on{border-color:var(--accent);color:var(--accent)}

/* ===== modo presentación ===== */
#pres{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:hidden}
body.presing #dlg{position:fixed;z-index:130}
body.presing .top{position:fixed;z-index:140}
#pcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.ptop{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;opacity:.5;transition:opacity .2s;z-index:2}
.ptop:hover{opacity:1}
.ptop span{font:500 12px var(--f-mono);color:var(--muted);min-width:56px;text-align:center}
.pnav{width:32px;height:32px;padding:0;font-size:18px;border-radius:50%;background:transparent}
.pclose{position:absolute;top:12px;right:14px;opacity:.5;z-index:2;background:transparent}
.pclose:hover{opacity:1}
.ptitlebox{position:absolute;transform:translateX(-50%);text-align:center;width:44%;pointer-events:none;z-index:1}
.ptitlebox h2{font-size:clamp(20px,2.8vw,34px);font-weight:600;line-height:1.15;text-shadow:0 2px 24px rgba(0,0,0,.7);overflow-wrap:anywhere}
.ptitlebox p{margin:8px 0 0;font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.ptitlebox.in{animation:pfade .6s ease-out}
.pcardwrap{position:absolute;right:4%;top:10%;bottom:19%;width:50%;display:flex;z-index:1;animation:floaty 7s ease-in-out infinite}
.pcard{margin:auto 0;width:100%;max-height:100%;overflow-y:auto;padding:24px 26px;border-radius:20px;background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--nc,var(--accent)) 50%,transparent);box-shadow:0 0 70px -14px color-mix(in srgb,var(--nc,var(--accent)) 55%,transparent),0 20px 50px rgba(0,0,0,.4);font-size:calc(17px*var(--pf,1));line-height:1.65;scrollbar-width:thin;overflow-wrap:anywhere}
.pcard.in{animation:pin .6s cubic-bezier(.2,.8,.2,1)}
.pcard .pey{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--nc,var(--accent));margin-bottom:12px}
.pcard .read{margin:0;min-height:0;font-size:inherit;line-height:inherit}
.pcard .read p{margin:0 0 .8em}
.pcard .read h4{font-size:1.08em;color:var(--nc,var(--accent));margin:1.2em 0 .4em;letter-spacing:.02em}
.pcard .read code{font-size:.85em}
.pim{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pi{height:auto;padding:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);flex:1 1 100%}
.pi img{display:block;width:100%;max-height:32vh;object-fit:contain;background:rgba(0,0,0,.25)}
.pi.s{flex:0 0 calc(33.3% - 6px)}
.pi.s img{max-height:90px;object-fit:cover}
.prel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.prel>span{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{height:28px;padding:0 10px;font-size:12px;border-radius:14px;display:flex;align-items:center;gap:6px;font-weight:500}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--sw);display:inline-block}
.pthumbs{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:92%;display:flex;gap:6px;overflow-x:auto;padding:4px 8px;z-index:2;scrollbar-width:none}
.pthumbs::-webkit-scrollbar{display:none}
.pt{position:relative;flex:none;width:48px;height:56px;padding:0;border:1px solid transparent;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;opacity:.4;transition:opacity .25s}
.pthumbs:hover .pt{opacity:.9}
.pt canvas{width:44px;height:44px;display:block}
.pt span{font:500 10px var(--f-mono);text-transform:uppercase;color:var(--muted);margin-top:-2px}
.pt.on{opacity:1;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pt:hover{border-color:var(--line)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pin{from{opacity:0;transform:translateX(70px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pfade{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-width:760px){
  .pcardwrap{left:4%;right:4%;width:auto;top:50%;bottom:78px}
  .pcard{font-size:calc(15px*var(--pf,1));padding:18px}
  .ptitlebox{width:90%}
  .ptop{top:8px;left:8px;transform:none;flex-wrap:wrap;max-width:calc(100% - 110px)}
  .pthumbs{max-width:100%}
}
@media (prefers-reduced-motion:reduce){.pcardwrap{animation:none}.pcard.in,.ptitlebox.in{animation:none}}

/* ===== v3: panel ajustable, menú contextual, letras ===== */
#pgrip{position:absolute;top:0;bottom:0;width:10px;z-index:11;cursor:col-resize;touch-action:none}
#pgrip::after{content:"";position:absolute;left:4px;top:50%;height:44px;width:3px;margin-top:-22px;border-radius:2px;background:var(--muted);opacity:0;transition:opacity .2s}
#pgrip:hover::after,#pgrip:focus-visible::after{opacity:.75}
#cmenu{position:fixed;z-index:60;min-width:210px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 12px 36px rgba(0,0,0,.45)}
#cmenu[hidden]{display:none}
#cmenu button{display:flex;justify-content:space-between;align-items:center;gap:18px;width:100%;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:500;font-size:13px}
#cmenu button:hover{background:var(--surface2)}
#cmenu small{color:var(--muted);font:500 11px var(--f-mono)}
#cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pnone{font:500 12px var(--f-mono);color:var(--muted);opacity:.5;padding:18px 8px;white-space:nowrap}
.pfs{font-size:12px}

/* ===== v5: editor visual (lo que ves es lo que se guarda) ===== */
.rtb{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.rtb button{height:30px;padding:0 10px;font-size:12px}
.rtb .sep{width:1px;background:var(--line);margin:3px 2px}

function blank(){return {v:1,updatedAt:0,current:'primera',subjects:[{id:'primera',name:'Mi primera materia',color:'azul',notes:[],view:null}]};}

  });
  o.barsMin=o.barsMin||{bar:false,tabs:false};o.theme=o.theme||'galaxia';o.editor=o.editor||'rich';o.presScale=o.presScale||1;o.panelW=o.panelW||360;

    var M=1400,w=im.naturalWidth||800,h=im.naturalHeight||600,s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);

/* ---------- estado ---------- */

function reindex(){byId=new Map(subj.notes.map(function(n){return [n.id,n];}));}
function parseLinks(b){var out=[],re=/\[\[([^\[\]|]+?)(?:\|[^\[\]]*)?\]\]/g,m;while((m=re.exec(b)))out.push(m[1].trim());return out;}
function rebuild(){
  var by=new Map(),keys=new Map();edges=[];
  subj.notes.forEach(function(n){var k=n.t.trim().toLowerCase();if(k&&!by.has(k))by.set(k,n);n._out=new Set();n._un=[];n._in=new Set();n._man=new Set();n._nb=new Set();n._kids=[];n._par=null;});
  function add(a,b,t){if(a===b)return;var k=a.id<b.id?a.id+'|'+b.id:b.id+'|'+a.id,e=keys.get(k);if(e){if(t==='p')e[2]='p';return;}e=[a,b,t||'l'];keys.set(k,e);edges.push(e);}
  subj.notes.forEach(function(n){if(n.parent){var pp=byId.get(n.parent);if(pp&&pp!==n){n._par=pp;pp._kids.push(n);add(n,pp,'p');}else n.parent=null;}});
  subj.notes.forEach(function(n){
    parseLinks(n.body).forEach(function(t){
      var m=by.get(t.toLowerCase());
      if(m){if(m!==n){n._out.add(m.id);m._in.add(n.id);add(n,m);}}
      else if(n._un.indexOf(t)<0)n._un.push(t);
    });

/* ---------- física del mapa ---------- */
function step(){
  var N=subj.notes,i,j,a,b,dx,dy,d2,d,f,ov;
  N.forEach(function(n){n._fx=0;n._fy=0;});
  for(i=0;i<N.length;i++){a=N[i];for(j=i+1;j<N.length;j++){b=N[j];dx=b.x-a.x;dy=b.y-a.y;d2=dx*dx+dy*dy;
    if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=dx*dx+dy*dy+.01;}
    if(d2>360000)continue;d=Math.sqrt(d2);f=160/d;
    ov=a._r+b._r+14-d;if(ov>0)f+=ov*.3;
    a._fx-=dx/d*f;a._fy-=dy/d*f;b._fx+=dx/d*f;b._fy+=dy/d*f;}}
  edges.forEach(function(e){a=e[0];b=e[1];dx=b.x-a.x;dy=b.y-a.y;d=Math.sqrt(dx*dx+dy*dy)||1;f=(d-((e[2]==='p'?70:95)+(a._r+b._r)*.9))*(e[2]==='p'?.07:.05);
    a._fx+=dx/d*f;a._fy+=dy/d*f;b._fx-=dx/d*f;b._fy-=dy/d*f;});
  N.forEach(function(n){
    n._fx-=n.x*.012;n._fy-=n.y*.012;
    if(n._pin){n._vx=0;n._vy=0;return;}
    n._vx=((n._vx||0)+n._fx*alpha)*.6;n._vy=((n._vy||0)+n._fy*alpha)*.6;n.x+=n._vx;n.y+=n._vy;
  });
}

function createNote(t,x,y,near){
  if(subj.notes.length>=300){toast('La materia llegó al límite de 300 notas.');return null;}
  t=(t||'').trim()||'Nota nueva';
  if(typeof x!=='number'){
    var a=Math.random()*Math.PI*2;
    if(near){x=near.x+Math.cos(a)*90;y=near.y+Math.sin(a)*90;}else{x=Math.cos(a)*60;y=Math.sin(a)*60;}
  }
  var n=mk(t,'',x,y,near?near.color:subj.color);subj.notes.push(n);reindex();rebuild();alpha=Math.max(alpha,.7);posDirty=true;renderTabs();save();return n;
}

      var tg=findByTitle(t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"));
      return '<button type="button" class="wl'+(tg?'':' un')+'" data-act="wl" data-t="'+t.trim()+'">'+(al&&al.trim()?al.trim():t.trim())+'</button>';
    });

function acUpdate(ta){
  var pos=ta.selectionStart,m=/\[\[([^\[\]\n|]*)$/.exec(ta.value.slice(0,pos));
  if(!m){acClose();return;}
  var q=m[1].toLowerCase(),cur=byId.get(sel);
  var items=subj.notes.filter(function(n){return n!==cur&&(!q||n.t.toLowerCase().indexOf(q)>=0);}).sort(function(a,b){var pa=a.t.toLowerCase().indexOf(q)===0?0:1,pb=b.t.toLowerCase().indexOf(q)===0?0:1;return pa-pb||a.t.localeCompare(b.t);}).slice(0,6);
  if(!items.length){acClose();return;}
  ac={on:true,items:items,i:0,start:pos-m[1].length};acRender();
}
function acPick(ta,n){
  var pos=ta.selectionStart,closing=ta.value.slice(pos,pos+2)===']]'?2:0;
  ta.setRangeText(n.t+']]',ac.start,pos+closing,'end');acClose();ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function wrapSel(ta,mark){

  ta.setRangeText(mark+sel2+mark,a,b,'end');if(a===b)ta.setSelectionRange(a+mark.length,a+mark.length);ta.dispatchEvent(new Event('input',{bubbles:true}));

    return;

  if(ac.on){
    if(e.key==='ArrowDown'){e.preventDefault();ac.i=(ac.i+1)%ac.items.length;acRender();return;}
    if(e.key==='ArrowUp'){e.preventDefault();ac.i=(ac.i-1+ac.items.length)%ac.items.length;acRender();return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();acPick(ta,ac.items[ac.i]);return;}
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();acClose();return;}
  }
  if(mod&&e.key.toLowerCase()==='b'){e.preventDefault();toggleWrap(ta,'**');return;}
  if(mod&&e.key.toLowerCase()==='i'){e.preventDefault();toggleWrap(ta,'*');return;}

  }

  else{ta.setRangeText(mark+v.slice(a,b)+mark,a,b,'select');ta.setSelectionRange(a+m,b+m);}

var BLK=/^(P|DIV|H[1-6]|UL|OL|LI|BLOCKQUOTE|PRE)$/;

function inl(n){
  if(n.nodeType===3)return n.nodeValue.replace(/ /g,' ');
  if(n.nodeType!==1)return '';
  var tag=n.nodeName;
  if(tag==='BR')return '\n';
  if(tag==='SPAN'&&n.classList.contains('wl')&&n.getAttribute('data-t')){var t=n.getAttribute('data-t'),lb=n.textContent;return '[['+t+(lb&&lb!==t?'|'+lb:'')+']]';}
  var inner='';for(var c=n.firstChild;c;c=c.nextSibling)inner+=inl(c);
  if(!inner.trim())return inner;
  var st=n.style||{},fw=st.fontWeight,bold=tag==='B'||tag==='STRONG'||fw==='bold'||(+fw>=600),ital=tag==='I'||tag==='EM'||st.fontStyle==='italic',und=tag==='U'||(st.textDecoration||'').indexOf('underline')>=0;
  if(tag==='CODE')return wrapMark('`',inner);
  if(ital)inner=wrapMark('*',inner);
  if(bold)inner=wrapMark('**',inner);
  if(und)inner=wrapMark('__',inner);
  return inner;
}
function richToMd(root){
  var lines=[],buf='';
  function flush(){buf.split('\n').forEach(function(l){if(l.trim())lines.push(l.trim());});buf='';}
  function walk(el){
    for(var c=el.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3||!BLK.test(c.nodeName)){buf+=inl(c);continue;}
      flush();var tag=c.nodeName;
      if(/^H[1-6]$/.test(tag)){var t=inl(c).replace(/\n/g,' ').trim();if(t)lines.push('# '+t);}
      else if(tag==='UL'||tag==='OL'){var i=0;for(var li=c.firstChild;li;li=li.nextSibling){if(li.nodeName!=='LI')continue;var tx=inl(li).replace(/\n/g,' ').trim();if(tx){i++;lines.push((tag==='UL'?'- ':i+'. ')+tx);}}}
      else{var hasB=false;for(var k=c.firstChild;k;k=k.nextSibling)if(k.nodeType===1&&BLK.test(k.nodeName)){hasB=true;break;}
        if(hasB){walk(c);flush();}else{buf=inl(c);flush();}}
    }
  }
  walk(root);flush();return lines.join('\n');
}

var FIX={tambien:'también',ademas:'además',asi:'así',despues:'después',ultimo:'último',ultima:'última',codigo:'código',articulo:'artículo',juridico:'jurídico',juridica:'jurídica',numero:'número',analisis:'análisis',metodo:'método',hipotesis:'hipótesis',segun:'según',facil:'fácil',dificil:'difícil',util:'útil',ambito:'ámbito',clausula:'cláusula',proposito:'propósito',tramite:'trámite',traves:'través',unico:'único',unica:'única',rapido:'rápido',telefono:'teléfono',algun:'algún',ningun:'ningún',pais:'país',paises:'países',titulo:'título',capitulo:'capítulo',estan:'están',dia:'día',dias:'días',academico:'académico',maximo:'máximo',minimo:'mínimo',caracter:'carácter',tecnico:'técnico',tecnica:'técnica',licito:'lícito',ilicito:'ilícito',quizas:'quizás',jamas:'jamás',aqui:'aquí',alli:'allí',ahi:'ahí',economico:'económico',economica:'económica',politico:'político',historico:'histórico',publica:'pública',indemnizacion:'indemnización'};

function fixText(txt){
  var cnt=0,L='A-Za-zÁÉÍÓÚÜÑáéíóúüñ';

  var re2=new RegExp('(['+L+']+)([csg])ion(?!['+L+'])','g');
  var out=txt.split(/(\[\[[^\]]*\]\])/).map(function(seg,i){
    if(i%2)return seg;
    seg=seg.replace(re,function(m,pre,w){
      var f=FIX[w.toLowerCase()];cnt++;
      if(w.length>1&&w===w.toUpperCase())f=f.toUpperCase();
      else if(w.charAt(0)!==w.charAt(0).toLowerCase())f=f.charAt(0).toUpperCase()+f.slice(1);
      return pre+f;
    });
    seg=seg.replace(re2,function(m,a,b){cnt++;return a+b+'ión';});
    return seg.replace(/(\S) {2,}/g,'$1 ');
  }).join('');
  return {t:out,n:cnt};
}

  });
  var enc=new TextEncoder();
  var meta={app:'boveda-apuntes-carpeta',v:2,at:Date.now(),theme:S.theme,subjects:clean,imgs:map};
  var readme='Bóveda de apuntes — copia portátil\r\n\r\nPara usarla en otra computadora: abre la Bóveda de apuntes, pulsa «Respaldo» y luego «Importar carpeta…», y elige esta carpeta completa.\r\nNo muevas ni renombres los archivos de dentro (boveda.json y la carpeta imagenes).\r\n';
  files.unshift({path:'LEEME.txt',bytes:enc.encode(readme)});
  files.unshift({path:'boveda.json',bytes:enc.encode(JSON.stringify(meta))});
  return {files:files,nimg:nimg};
}
var CRCT=null;
function crc32(u){
  if(!CRCT){CRCT=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);CRCT[n]=c>>>0;}}
  var c2=0xFFFFFFFF;for(var i=0;i<u.length;i++)c2=CRCT[(c2^u[i])&255]^(c2>>>8);return (c2^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0,d=new Date();
  var dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  files.forEach(function(f){
    var nm=enc.encode(f.path),crc=crc32(f.bytes),sz=f.bytes.length;
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.bytes);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  });
  var cs=0;cen.forEach(function(p){cs+=p.length;});
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:'application/zip'});
}
function writeAll(root,files){
  var p=Promise.resolve();
  files.forEach(function(f){
    p=p.then(function(){
      var segs=f.path.split('/'),name=segs.pop(),q=Promise.resolve(root);
      segs.forEach(function(sg){q=q.then(function(dh){return dh.getDirectoryHandle(sg,{create:true});});});
      return q.then(function(dh){return dh.getFileHandle(name,{create:true});}).then(function(fh){return fh.createWritable();}).then(function(w){return w.write(f.bytes).then(function(){return w.close();});});
    });
  });
  return p;
}
function zipDownload(pk,folder){
  var files=pk.files.map(function(f){return {path:folder+'/'+f.path,bytes:f.bytes};});
  var blob=makeZip(files),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=folder+'.zip';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a);},4000);
  toast('Se descargó «'+folder+'.zip» ('+pk.nimg+' imágenes). Descomprímelo y usa «Importar carpeta…» en la otra computadora.');
}
function exportSubjects(list){
  if(!list||!list.length)return;
  var folder=list.length===1?'Boveda - '+cleanName(list[0].name):'Boveda - todas las materias',pk;
  try{pk=buildPackage(list);}catch(x){toast('No se pudo preparar la exportación.');return;}
  closeDlg();
  if(window.showDirectoryPicker){
    window.showDirectoryPicker({mode:'readwrite'}).then(function(root){return root.getDirectoryHandle(folder,{create:true});}).then(function(dir){return writeAll(dir,pk.files);}).then(function(){
      toast('Carpeta «'+folder+'» guardada: '+list.length+(list.length===1?' materia':' materias')+' y '+pk.nimg+' imágenes.');
    },function(err){if(err&&err.name==='AbortError')return;zipDownload(pk,folder);});
  }else zipDownload(pk,folder);
}
function readDataUrl(file,ext){return new Promise(function(res){
  var fr=new FileReader();
  fr.onload=function(){var mime=ext==='jpg'?'jpeg':(ext==='svg'?'svg+xml':ext);res(String(fr.result).replace(/^data:[^;,]*/,'data:image/'+mime));};
  fr.onerror=function(){res(null);};fr.readAsDataURL(file);
});}
function importDir(fl){
  var files=Array.prototype.slice.call(fl),byPath={},js=null;
  files.forEach(function(f){
    var rel=(f.webkitRelativePath||f.name).split('/').slice(1).join('/');
    byPath[rel]=f;if(rel==='boveda.json')js=f;
  });
  if(!js){toast('Esa carpeta no tiene boveda.json. Elige la carpeta que exportaste.');return;}
  var fr=new FileReader();
  fr.onload=function(){
    var o;try{o=JSON.parse(fr.result);}catch(x){}
    if(!o||o.app!=='boveda-apuntes-carpeta'||!Array.isArray(o.subjects)||!o.subjects.length){toast('Esa carpeta no es una exportación de la Bóveda de apuntes.');return;}
    var ids=Object.keys(o.imgs||{}),missing=0;
    Promise.all(ids.map(function(id){
      var f=byPath[o.imgs[id]];if(!f){missing++;return Promise.resolve(null);}
      return readDataUrl(f,(o.imgs[id].split('.').pop()||'jpg').toLowerCase());
    })).then(function(datas){
      ids.forEach(function(id,i){if(datas[i]){imgData.set(id,datas[i]);imgEl.delete(id);idbPut(id,datas[i]);}});
      var tmp=norm({subjects:o.subjects,current:o.subjects[0].id}),names=S.subjects.map(function(s){return s.name.toLowerCase();}),first=null;
      tmp.subjects.forEach(function(s){
        s.id=uid();s.view=null;
        var nm=s.name,c=2;while(names.indexOf(nm.toLowerCase())>=0)nm=s.name+' ('+(c++)+')';
        s.name=nm;names.push(nm.toLowerCase());
        s.notes.forEach(function(n){n.imgs=n.imgs.filter(function(id){return imgData.has(id);});});
        S.subjects.push(s);if(!first)first=s;
      });
      closeDlg();setSubject(first.id);save();
      toast('Importadas '+tmp.subjects.length+(tmp.subjects.length===1?' materia':' materias')+(missing?' ('+missing+' imágenes no se encontraron)':'')+'. Puedes deshacer con Ctrl+Z.');
    });
  };
  fr.readAsText(js);
}
$('#fileDir').addEventListener('change',function(e){var l=e.target.files;if(l&&l.length)importDir(l);e.target.value='';});
